<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HematYUK!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: satu kolom selebar layar HP (maks 480px), dipusatkan di layar lebar; navigasi tetap di bawah dengan tombol + di tengah. */
:root {
  --bg: #f3f7f2;
  --surface: #ffffff;
  --fg: #12231a;
  --muted: #5a6e60;
  --line: #dbe6dc;
  --accent: #1c7a3b;
  --accent-fg: #ffffff;
  --accent-soft: #e2f1e6;
  --warn: #9a5f0a;
  --warn-bg: #fcf1d9;
  --bad: #b5342a;
  --bad-bg: #fae4e1;
  --c1: #1c7a3b;
  --c2: #d98e0f;
  --c3: #2f7fc1;
  --c4: #b4458a;
  --c5: #6a5acd;
  --c6: #7b8a80;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1511; --surface: #15201a; --fg: #e8f1ea; --muted: #92a89a; --line: #25352b;
    --accent: #4cc272; --accent-fg: #07200f; --accent-soft: #1b3525;
    --warn: #ecb552; --warn-bg: #33290f; --bad: #f08577; --bad-bg: #3b1b17;
    --c1: #4cc272; --c2: #eeb04a; --c3: #5fa8e6; --c4: #e07bb8; --c5: #9a8cf0; --c6: #94a79b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1511; --surface: #15201a; --fg: #e8f1ea; --muted: #92a89a; --line: #25352b;
  --accent: #4cc272; --accent-fg: #07200f; --accent-soft: #1b3525;
  --warn: #ecb552; --warn-bg: #33290f; --bad: #f08577; --bad-bg: #3b1b17;
  --c1: #4cc272; --c2: #eeb04a; --c3: #5fa8e6; --c4: #e07bb8; --c5: #9a8cf0; --c6: #94a79b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.app { max-width: 480px; margin: 0 auto; padding-bottom: 116px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 8px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
.brand span { color: var(--accent); }
.hello { color: var(--muted); font-size: 13px; text-align: right; }
.hello b { color: var(--fg); font-weight: 600; }
#view { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.card h2 { font-size: 17px; margin-bottom: 12px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.balance { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.balance .label { color: inherit; opacity: 0.8; }
.balance .big { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: -0.02em; margin: 4px 0 12px; }
.balance .sub { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; opacity: 0.92; }
.sub b { display: block; font-size: 15px; font-weight: 700; }
.note { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: 13px; }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn.danger { background: var(--bad); color: #fff; }
.btn.outline-danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar.warn > i { background: var(--c2); }
.bar.bad > i { background: var(--bad); }
.gauge-wrap { display: flex; align-items: center; gap: 16px; }
.gauge { width: 132px; flex: none; }
.gauge text { fill: var(--fg); font-family: var(--font-display); font-weight: 800; }
.gauge .sm { fill: var(--muted); font-family: var(--font-body); font-weight: 500; }
.gauge-info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.gauge-info .big { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
.alert { margin-top: 12px; border-radius: 12px; padding: 10px 14px; font-size: 13px; background: var(--warn-bg); color: var(--warn); font-weight: 500; }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert.good { background: var(--accent-soft); color: var(--accent); }
.goal { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.goal:first-of-type { border-top: 0; padding-top: 0; }
.goal .bar { grid-column: 1 / -1; }
.goal .meta { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 1px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="date"] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
input.money { font-family: var(--font-display); font-weight: 600; font-size: 20px; }
.inline-set { display: flex; gap: 10px; }
.inline-set input { flex: 1; min-width: 0; }
.tx { display: grid; grid-template-columns: 36px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.tx:first-of-type { border-top: 0; }
.dot { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
.tx .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.tx .s { color: var(--muted); font-size: 12px; }
.tx .amt { font-weight: 700; text-align: right; }
.amt.in { color: var(--accent); }
.x { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: 8px; font-size: 18px; line-height: 1; }
.x:hover { background: var(--bad-bg); color: var(--bad); }
.dayhead { margin: 14px 0 2px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.dayhead:first-of-type { margin-top: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.seg button, .seg label { padding: 7px 14px; font-size: 13px; font-weight: 600; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg .on, .seg input:checked + span { background: var(--accent); color: var(--accent-fg); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { display: block; padding: 0; }
.seg label span { display: block; padding: 7px 14px; }
.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut { width: 140px; flex: none; }
.donut text { fill: var(--fg); font-family: var(--font-display); font-weight: 800; }
.donut .sm { fill: var(--muted); font-family: var(--font-body); font-weight: 500; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 140px; }
.legend li { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend b { margin-left: auto; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .lim { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.6; }
.hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 5;
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.nav button.tab { border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; padding: 4px 0; }
.nav button.tab[aria-current="page"] { color: var(--accent); }
.nav svg { width: 22px; height: 22px; }
.fab { justify-self: center; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); font-size: 28px; line-height: 1; margin-top: -24px; box-shadow: 0 4px 14px rgba(0,0,0,0.22); }
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8, 20, 12, 0.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sheet-head h2 { font-size: 19px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { cursor: pointer; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips span { display: inline-block; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; background: var(--bg); }
.chips input:checked + span { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chips input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) {
  .bar > i { transition: width 0.4s ease; }
}
a.btn { display: inline-block; text-decoration: none; text-align: center; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.stat b { font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.catrow { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.catrow:last-child { margin-bottom: 0; }
.catname { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.pct { color: var(--muted); font-weight: 600; font-size: 12px; margin-left: 4px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.pchip { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.pchip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.ptx { grid-template-columns: 36px 1fr auto; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Hemat<span>YUK!</span></div>
    <div class="hello" id="hello"></div>
  </header>
  <main id="view"></main>
</div>

<nav class="nav" aria-label="Menu utama">
  <button class="tab" data-tab="beranda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Beranda</button>
  <button class="tab" data-tab="transaksi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Transaksi</button>
  <button class="fab" data-action="open-add" aria-label="Catat transaksi">+</button>
  <button class="tab" data-tab="laporan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Laporan</button>
  <button class="tab" data-tab="akun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Akun</button>
</nav>

<div class="overlay" id="sheet-add" hidden>
  <form class="sheet" id="form-add" autocomplete="off">
    <div class="sheet-head"><h2>Catat transaksi</h2><button type="button" class="btn ghost small" data-action="close">Tutup</button></div>
    <div class="field">
      <div class="seg" role="radiogroup" aria-label="Jenis transaksi">
        <label><input type="radio" name="f-type" value="out" checked><span>Pengeluaran</span></label>
        <label><input type="radio" name="f-type" value="in"><span>Pemasukan</span></label>
      </div>
    </div>
    <div class="field"><label for="f-amount">Jumlah (Rp)</label><input type="text" id="f-amount" class="money" inputmode="numeric" placeholder="0"></div>
    <div class="field" id="cat-field"><label>Kategori</label><div class="chips" id="f-cats"></div></div>
    <div class="field"><label for="f-note">Catatan (opsional)</label><input type="text" id="f-note" maxlength="60" placeholder="Contoh: makan siang"></div>
    <div class="field"><label for="f-date">Tanggal</label><input type="date" id="f-date"></div>
    <div class="alert bad" id="add-err" hidden style="margin:0 0 12px"></div>
    <button class="btn" type="submit" style="width:100%">Simpan</button>
  </form>
</div>

<div class="overlay" id="sheet-save" hidden>
  <form class="sheet" id="form-save" autocomplete="off">
    <div class="sheet-head"><h2 id="save-title">Setor ke target</h2><button type="button" class="btn ghost small" data-action="close">Tutup</button></div>
    <div class="field"><label for="s-amount">Jumlah setoran (Rp)</label><input type="text" id="s-amount" class="money" inputmode="numeric" placeholder="0"></div>
    <div class="hint" id="save-hint" style="margin:-4px 0 12px"></div>
    <div class="alert bad" id="save-err" hidden style="margin:0 0 12px"></div>
    <button class="btn" type="submit" style="width:100%">Setor</button>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  var KEY = "hematyuk.v1";
  var CATS = [
    { id: "makan", n: "Makan", c: "var(--c1)", s: "Mk" },
    { id: "transport", n: "Transport", c: "var(--c2)", s: "Tr" },
    { id: "hiburan", n: "Hiburan", c: "var(--c3)", s: "Hb" },
    { id: "belanja", n: "Belanja", c: "var(--c4)", s: "Bl" },
    { id: "sekolah", n: "Sekolah", c: "var(--c5)", s: "Sk" },
    { id: "lainnya", n: "Lainnya", c: "var(--c6)", s: "Ln" }
  ];
  var SPECIAL = {
    masuk: { n: "Uang masuk", c: "var(--accent)", s: "+" },
    tabung: { n: "Tabungan", c: "var(--c3)", s: "Tb" }
  };
  var DAYS = ["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"];
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];

  var state, tab = "beranda", period = "7", saveGoalId = null, resetArmed = false, toastTimer = null;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dkey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; }
  function todayKey() { return dkey(new Date()); }
  function rp(n) { return "Rp " + Math.round(n).toLocaleString("id-ID"); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function digits(s) { var d = String(s).replace(/\D/g, ""); return d ? parseInt(d, 10) : 0; }
  function fmtK(v) { return String(Math.round(v / 100) / 10).replace(".", ",") + "rb"; }
  function catOf(id) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i];
    return SPECIAL[id] || CATS[5];
  }
  function dateLabel(k) {
    if (k === todayKey()) return "Hari ini";
    if (k === dkey(addDays(new Date(), -1))) return "Kemarin";
    var p = k.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
  }

  function seed() {
    var t = new Date(), tx = [], id = 1;
    function add(off, type, cat, amount, note) { tx.push({ id: id++, date: dkey(addDays(t, off)), type: type, cat: cat, amount: amount, note: note }); }
    add(0, "out", "makan", 20000, "Makan siang");
    add(0, "out", "transport", 5000, "Ojek");
    add(0, "out", "hiburan", 5000, "Nonton");
    add(-1, "out", "makan", 18000, "Nasi ayam");
    add(-1, "out", "transport", 10000, "Ojek pulang");
    add(-1, "out", "belanja", 12000, "Alat tulis");
    add(-2, "out", "makan", 25000, "Makan dan es teh");
    add(-2, "out", "hiburan", 12000, "Game online");
    add(-3, "out", "makan", 15000, "Bakso");
    add(-3, "out", "transport", 8000, "Angkot");
    add(-4, "out", "makan", 22000, "Makan siang");
    add(-4, "out", "belanja", 30000, "Kaos kaki");
    add(-4, "out", "sekolah", 15000, "Fotokopi");
    add(-5, "in", "masuk", 700000, "Uang saku bulanan");
    add(-5, "out", "makan", 20000, "Makan siang");
    add(-6, "out", "makan", 16000, "Mie ayam");
    add(-6, "out", "transport", 10000, "Ojek");
    return {
      v: 1, sample: true, name: "Riko", saldoAwal: 1250000, limit: 30000, nextId: id,
      goals: [
        { id: 1, name: "Sepeda Baru", target: 2000000, saved: 900000, main: true },
        { id: 2, name: "Dana Darurat", target: 1000000, saved: 100000, main: false },
        { id: 3, name: "Kursus Bahasa", target: 800000, saved: 80000, main: false },
        { id: 4, name: "Ponsel Baru", target: 3000000, saved: 150000, main: false }
      ],
      nextGoal: 5, tx: tx
    };
  }
  function blank(name) {
    return { v: 1, sample: false, name: name || "", saldoAwal: 0, limit: 30000, nextId: 1, goals: [], nextGoal: 1, tx: [] };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var s = JSON.parse(raw); if (s && s.v === 1) return s; }
    } catch (e) {}
    return seed();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function sums(dateKey) {
    var out = 0;
    state.tx.forEach(function (t) { if (t.type === "out" && t.date === dateKey) out += t.amount; });
    return out;
  }
  function balance() {
    var b = state.saldoAwal;
    state.tx.forEach(function (t) { b += t.type === "in" ? t.amount : -t.amount; });
    return b;
  }
  function mainGoal() {
    for (var i = 0; i < state.goals.length; i++) if (state.goals[i].main) return state.goals[i];
    return state.goals[0] || null;
  }
  function monthTotals() {
    var m = todayKey().slice(0, 7), inn = 0, out = 0;
    state.tx.forEach(function (t) {
      if (t.date.slice(0, 7) !== m) return;
      if (t.type === "in") inn += t.amount; else if (t.type === "out") out += t.amount;
    });
    return { inn: inn, out: out };
  }
  function limitState() {
    var spent = sums(todayKey()), lim = state.limit, pct = lim > 0 ? spent / lim : 0;
    return { spent: spent, lim: lim, pct: pct, left: lim - spent, cls: pct > 1 ? "bad" : pct >= 0.8 ? "warn" : "" };
  }
  function alertHtml(ls) {
    if (ls.lim <= 0) return "";
    if (ls.pct > 1) return '<div class="alert bad">Limit hari ini terlewati ' + rp(ls.spent - ls.lim) + ". Tahan dulu pengeluaran sampai besok.</div>";
    if (ls.pct >= 0.8) return '<div class="alert">Hampir mencapai batas! Atur pengeluaranmu agar tetap hemat. Sisa ' + rp(ls.left) + ".</div>";
    return "";
  }

  function gaugeSvg(ls) {
    var len = Math.PI * 50, p = Math.min(ls.pct, 1);
    var col = ls.cls === "bad" ? "var(--bad)" : ls.cls === "warn" ? "var(--c2)" : "var(--accent)";
    return '<svg class="gauge" viewBox="0 0 120 78" role="img" aria-label="Pengeluaran hari ini ' + Math.round(ls.pct * 100) + ' persen dari limit">' +
      '<path d="M10 64 A50 50 0 0 1 110 64" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/>' +
      '<path d="M10 64 A50 50 0 0 1 110 64" fill="none" stroke="' + col + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (len * p).toFixed(2) + " " + len.toFixed(2) + '"/>' +
      '<text x="60" y="52" text-anchor="middle" font-size="22">' + Math.round(ls.pct * 100) + '%</text>' +
      '<text class="sm" x="60" y="72" text-anchor="middle" font-size="9">dari limit</text></svg>';
  }

  function limitCard() {
    var ls = limitState();
    return '<section class="card"><h2>Limit hari ini</h2><div class="gauge-wrap">' + gaugeSvg(ls) +
      '<div class="gauge-info"><span class="label">Sisa limit</span><span class="big num">' + rp(Math.max(ls.left, 0)) + '</span>' +
      '<span class="hint num" style="margin:0">Terpakai ' + rp(ls.spent) + " dari " + rp(ls.lim) + "</span></div></div>" +
      '<div class="bar ' + ls.cls + '" style="margin-top:14px"><i style="width:' + Math.min(ls.pct * 100, 100) + '%"></i></div>' +
      alertHtml(ls) + "</section>";
  }

  function goalRow(g, withSave) {
    var p = g.target > 0 ? Math.min(g.saved / g.target, 1) : 0;
    return '<div class="goal"><div><strong>' + esc(g.name) + "</strong>" + (g.main ? '<span class="pill">Utama</span>' : "") +
      '<div class="meta num">' + rp(g.saved) + " dari " + rp(g.target) + "</div></div>" +
      '<div class="row" style="gap:8px"><b class="num">' + Math.round(p * 100) + "%</b>" +
      (withSave ? '<button class="btn ghost small" data-action="save-goal" data-id="' + g.id + '">Setor</button>' : "") + "</div>" +
      '<div class="bar"><i style="width:' + (p * 100) + '%"></i></div></div>';
  }

  function viewBeranda() {
    var m = monthTotals(), mg = mainGoal(), h = "";
    if (state.sample) {
      h += '<div class="note"><span>Ini data contoh. Hapus lalu isi dengan datamu sendiri.</span><button class="btn small" data-action="clear-sample">Mulai dari nol</button></div>';
    }
    h += '<section class="card balance"><span class="label">Saldo saat ini</span><div class="big num">' + rp(balance()) + '</div>' +
      '<div class="sub"><span>Pemasukan bulan ini<b class="num">' + rp(m.inn) + '</b></span><span>Pengeluaran bulan ini<b class="num">' + rp(m.out) + "</b></span></div></section>";
    h += limitCard();
    if (mg) {
      h += '<section class="card"><span class="label">Target utama</span><div style="margin-top:8px">' + goalRow(mg, true).replace('class="goal"', 'class="goal" style="border:0;padding:0"') + "</div></section>";
    }
    var others = state.goals.filter(function (g) { return !mg || g.id !== mg.id; });
    h += '<section class="card"><h2>Target lainnya</h2>';
    if (!state.goals.length) h += '<p class="empty">Belum ada target. Tambahkan di menu Akun.</p>';
    else if (!others.length) h += '<p class="empty">Hanya ada satu target. Tambah target lain di menu Akun.</p>';
    else h += others.map(function (g) { return goalRow(g, true); }).join("");
    h += "</section>";
    return h;
  }

  function txRow(t) {
    var c = catOf(t.cat), isIn = t.type === "in";
    return '<div class="tx"><div class="dot" style="background:' + c.c + '">' + c.s + '</div>' +
      '<div style="min-width:0"><div class="t">' + esc(t.note || c.n) + '</div><div class="s">' + c.n + "</div></div>" +
      '<div class="amt num ' + (isIn ? "in" : "") + '">' + (isIn ? "+" : "-") + rp(t.amount) + "</div>" +
      '<button class="x" data-action="del-tx" data-id="' + t.id + '" aria-label="Hapus transaksi">&times;</button></div>';
  }

  function viewTransaksi() {
    var ls = limitState(), h = "";
    h += '<section class="card"><h2>Set limit harian</h2><div class="field" style="margin-bottom:0"><label for="limit-input">Tentukan limit pengeluaran per hari</label>' +
      '<div class="inline-set"><input type="text" id="limit-input" class="money" inputmode="numeric" value="' + ls.lim.toLocaleString("id-ID") + '"><button class="btn" data-action="apply-limit">Terapkan</button></div></div>' +
      '<div class="row" style="margin-top:14px"><span class="label">Sisa limit hari ini</span><b class="num">' + rp(Math.max(ls.left, 0)) + "</b></div>" +
      '<div class="bar ' + ls.cls + '" style="margin-top:8px"><i style="width:' + Math.min(ls.pct * 100, 100) + '%"></i></div>' + alertHtml(ls) + "</section>";
    var list = state.tx.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id; });
    h += '<section class="card"><h2>Daftar transaksi</h2>';
    if (!list.length) h += '<p class="empty">Belum ada transaksi. Tekan tombol + untuk mencatat.</p>';
    else {
      var last = "", shown = 0;
      list.forEach(function (t) {
        if (shown >= 40) return;
        if (t.date !== last) { h += '<div class="dayhead">' + dateLabel(t.date) + "</div>"; last = t.date; }
        h += txRow(t); shown++;
      });
      if (list.length > 40) h += '<p class="hint">Menampilkan 40 transaksi terbaru.</p>';
    }
    return h + "</section>";
  }

  function periodTx() {
    var today = new Date(), keys = {}, i;
    if (period === "7") { for (i = 0; i < 7; i++) keys[dkey(addDays(today, -i))] = 1; }
    return state.tx.filter(function (t) {
      if (t.type !== "out") return false;
      return period === "7" ? !!keys[t.date] : t.date.slice(0, 7) === todayKey().slice(0, 7);
    });
  }

  function donutHtml() {
    var tx = periodTx(), totals = {}, total = 0;
    tx.forEach(function (t) { totals[t.cat] = (totals[t.cat] || 0) + t.amount; total += t.amount; });
    var rows = CATS.filter(function (c) { return totals[c.id]; }).map(function (c) { return { c: c, v: totals[c.id] }; })
      .sort(function (a, b) { return b.v - a.v; });
    if (!total) return '<p class="empty">Belum ada pengeluaran pada periode ini.</p>';
    var R = 40, C = 2 * Math.PI * R, off = 0, segs = "";
    rows.forEach(function (r) {
      var len = C * r.v / total;
      segs += '<circle cx="60" cy="60" r="' + R + '" fill="none" style="stroke:' + r.c.c + '" stroke-width="18" stroke-dasharray="' + len.toFixed(2) + " " + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 60 60)"/>';
      off += len;
    });
    var svg = '<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="Pengeluaran per kategori">' + segs +
      '<text x="60" y="58" text-anchor="middle" font-size="12">' + fmtK(total) + '</text>' +
      '<text class="sm" x="60" y="72" text-anchor="middle" font-size="8">total</text></svg>';
    var legend = '<ul class="legend">' + rows.map(function (r) {
      return '<li><i style="background:' + r.c.c + '"></i>' + r.c.n + '<b class="num">' + Math.round(r.v / total * 100) + "%</b></li>";
    }).join("") + "</ul>";
    return '<div class="donut-wrap">' + svg + legend + '</div><div class="hint num">Total ' + rp(total) + "</div>";
  }

  function lastDays() {
    var res = [], t = new Date();
    for (var i = 6; i >= 0; i--) { var d = addDays(t, -i), k = dkey(d); res.push({ k: k, label: DAYS[d.getDay()], v: sums(k) }); }
    return res;
  }

  function barsHtml(days) {
    var W = 320, H = 170, L = 36, T = 10, B = 24, R = 6, pw = W - L - R, ph = H - T - B;
    var raw = Math.max(state.limit, Math.max.apply(null, days.map(function (d) { return d.v; })), 1000) * 1.1;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var max = Math.ceil(raw / mag) * mag;
    if ((max / 2) % 500 !== 0) max = Math.ceil(max / 1000) * 1000;
    function y(v) { return T + ph * (1 - v / max); }
    var s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Pengeluaran per hari, 7 hari terakhir">';
    [0, max / 2, max].forEach(function (v) {
      s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 5) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + (v === 0 ? "0" : fmtK(v)) + "</text>";
    });
    var slot = pw / days.length, bw = slot * 0.56;
    days.forEach(function (d, i) {
      var x = L + slot * i + (slot - bw) / 2, hh = ph * d.v / max;
      s += '<rect x="' + x.toFixed(1) + '" y="' + (T + ph - hh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(hh, d.v ? 1 : 0).toFixed(1) + '" rx="3" style="fill:' + (d.v > state.limit ? "var(--bad)" : "var(--accent)") + '"/>';
      s += '<text x="' + (L + slot * i + slot / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + d.label + "</text>";
    });
    s += '<line class="lim" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(state.limit) + '" y2="' + y(state.limit) + '"/></svg>';
    return s;
  }

  function evalHtml(days) {
    var withData = days.filter(function (d) { return d.v > 0; });
    if (!withData.length) return '<div class="alert good" style="margin:0">Belum ada data pengeluaran 7 hari terakhir. Catat transaksi pertamamu untuk melihat evaluasi.</div>';
    var over = days.filter(function (d) { return d.v > state.limit; }).length;
    var tx = periodTx(), tot = {};
    var keys = {}; days.forEach(function (d) { keys[d.k] = 1; });
    state.tx.forEach(function (t) { if (t.type === "out" && keys[t.date]) tot[t.cat] = (tot[t.cat] || 0) + t.amount; });
    var top = null;
    Object.keys(tot).forEach(function (k) { if (!top || tot[k] > tot[top]) top = k; });
    var avg = Math.round(days.reduce(function (a, d) { return a + d.v; }, 0) / 7);
    if (over === 0) return '<div class="alert good" style="margin:0"><b>Bagus!</b> Kamu tidak pernah melewati limit dalam 7 hari terakhir. Rata-rata pengeluaranmu ' + rp(avg) + " per hari. Terus pertahankan.</div>";
    return '<div class="alert" style="margin:0">Kamu melewati limit pada ' + over + " dari 7 hari terakhir. Rata-rata pengeluaranmu " + rp(avg) + " per hari. Pengeluaran terbesar ada di kategori " + catOf(top).n + ", mulai kurangi dari situ.</div>";
  }

  function viewLaporan() {
    var days = lastDays();
    return '<section class="card"><div class="row" style="margin-bottom:12px"><h2 style="margin:0">Ringkasan kategori</h2>' +
      '<div class="seg"><button data-period="7" class="' + (period === "7" ? "on" : "") + '">7 hari</button><button data-period="bulan" class="' + (period === "bulan" ? "on" : "") + '">Bulan ini</button></div></div>' +
      donutHtml() + "</section>" +
      '<section class="card"><h2>Pengeluaran per hari</h2>' + barsHtml(days) + '<div class="hint">Garis putus-putus menunjukkan limit harian ' + rp(state.limit) + ". Batang merah melewati limit.</div></section>" +
      '<section class="card"><h2>Evaluasi</h2>' + evalHtml(days) + "</section>";
  }

  function viewAkun() {
    var h = '<section class="card"><h2>Profil</h2>' +
      '<div class="field"><label for="a-name">Nama</label><input type="text" id="a-name" maxlength="24" value="' + esc(state.name) + '"></div>' +
      '<div class="field" style="margin-bottom:0"><label for="a-saldo">Saldo awal (Rp)</label><input type="text" id="a-saldo" class="money" inputmode="numeric" value="' + state.saldoAwal.toLocaleString("id-ID") + '"></div>' +
      '<p class="hint">Saldo saat ini dihitung dari saldo awal ditambah pemasukan dikurangi pengeluaran dan setoran target.</p></section>';
    h += '<section class="card"><h2>Target tabungan</h2>';
    if (!state.goals.length) h += '<p class="empty">Belum ada target.</p>';
    state.goals.forEach(function (g) {
      h += '<div class="goal"><div><strong>' + esc(g.name) + "</strong>" + (g.main ? '<span class="pill">Utama</span>' : "") + '<div class="meta num">' + rp(g.saved) + " dari " + rp(g.target) + "</div></div>" +
        '<div class="row" style="gap:6px">' + (g.main ? "" : '<button class="btn ghost small" data-action="main-goal" data-id="' + g.id + '">Jadikan utama</button>') +
        '<button class="x" data-action="del-goal" data-id="' + g.id + '" aria-label="Hapus target ' + esc(g.name) + '">&times;</button></div></div>';
    });
    h += '<form id="form-goal" autocomplete="off" style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px"><div class="field"><label for="g-name">Target baru</label><input type="text" id="g-name" maxlength="30" placeholder="Contoh: Sepatu olahraga"></div>' +
      '<div class="field"><label for="g-target">Jumlah target (Rp)</label><input type="text" id="g-target" class="money" inputmode="numeric" placeholder="0"></div>' +
      '<div class="alert bad" id="goal-err" hidden style="margin:0 0 12px"></div><button class="btn" type="submit">Tambah target</button></form></section>';
    h += parentCard();
    h += '<section class="card"><h2>Data</h2><p class="hint" style="margin:0 0 12px">Datamu tersimpan di browser ini saja. Menghapus data tidak bisa dibatalkan.</p>' +
      (resetArmed
        ? '<div class="stack"><button class="btn danger" data-action="reset-yes">Ya, hapus semua data</button><button class="btn ghost" data-action="reset-no">Batal</button></div>'
        : '<div class="stack"><button class="btn outline-danger" data-action="reset-ask">Hapus semua data</button><button class="btn ghost" data-action="load-sample">Pakai data contoh</button></div>') +
      "</section>";
    return h;
  }

  function render() {
    var v = document.getElementById("view");
    v.innerHTML = tab === "beranda" ? viewBeranda() : tab === "transaksi" ? viewTransaksi() : tab === "laporan" ? viewLaporan() : viewAkun();
    document.querySelectorAll(".tab").forEach(function (b) {
      if (b.getAttribute("data-tab") === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    document.getElementById("hello").innerHTML = state.name ? "Halo, <b>" + esc(state.name) + "</b>" : "";
  }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }
  function openSheet(id) { document.getElementById(id).hidden = false; }
  function closeSheets() { document.querySelectorAll(".overlay").forEach(function (o) { o.hidden = true; }); }
  function showErr(id, msg) { var e = document.getElementById(id); e.textContent = msg; e.hidden = !msg; }
  function go(t) { tab = t; resetArmed = false; render(); window.scrollTo(0, 0); }

  function buildCats() {
    document.getElementById("f-cats").innerHTML = CATS.map(function (c, i) {
      return '<label><input type="radio" name="f-cat" value="' + c.id + '"' + (i === 0 ? " checked" : "") + "><span>" + c.n + "</span></label>";
    }).join("");
  }
  function openAdd() {
    buildCats();
    document.getElementById("f-amount").value = "";
    document.getElementById("f-note").value = "";
    document.getElementById("f-date").value = todayKey();
    document.querySelector('input[name="f-type"][value="out"]').checked = true;
    document.getElementById("cat-field").hidden = false;
    showErr("add-err", "");
    openSheet("sheet-add");
    setTimeout(function () { document.getElementById("f-amount").focus(); }, 30);
  }

  function liveMoney(el) {
    var n = digits(el.value);
    el.value = n ? n.toLocaleString("id-ID") : "";
  }

  document.addEventListener("input", function (e) {
    var el = e.target;
    if (el.classList && el.classList.contains("money")) liveMoney(el);
  });
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.name === "f-type") document.getElementById("cat-field").hidden = el.value === "in";
    if (el.id === "a-name") { state.name = el.value.trim(); save(); render(); toast("Nama disimpan"); }
    if (el.id === "a-saldo") { state.saldoAwal = digits(el.value); save(); toast("Saldo awal disimpan"); render(); }
  });

  document.addEventListener("click", function (e) {
    var tb = e.target.closest("[data-tab]");
    if (tb) { go(tb.getAttribute("data-tab")); return; }
    var pb = e.target.closest("[data-period]");
    if (pb) { period = pb.getAttribute("data-period"); render(); return; }
    if (e.target.classList && e.target.classList.contains("overlay")) { closeSheets(); return; }
    var a = e.target.closest("[data-action]");
    if (!a) return;
    var act = a.getAttribute("data-action"), id = parseInt(a.getAttribute("data-id"), 10);
    if (act === "open-add") openAdd();
    else if (act === "close") closeSheets();
    else if (act === "clear-sample") { state = blank(state.name); save(); render(); toast("Data contoh dihapus. Isi saldo awal di menu Akun."); go("akun"); }
    else if (act === "load-sample") { state = seed(); resetArmed = false; save(); render(); toast("Data contoh dimuat"); }
    else if (act === "apply-limit") {
      var n = digits(document.getElementById("limit-input").value);
      if (n <= 0) { toast("Isi limit lebih dari nol"); return; }
      state.limit = n; save(); render(); toast("Limit harian " + rp(n) + " diterapkan");
    }
    else if (act === "del-tx") {
      var del = state.tx.filter(function (t) { return t.id === id; })[0];
      if (del && del.type === "save") {
        state.goals.forEach(function (g) { if (g.id === del.goalId) g.saved = Math.max(g.saved - del.amount, 0); });
      }
      state.tx = state.tx.filter(function (t) { return t.id !== id; });
      save(); render(); toast("Transaksi dihapus");
    }
    else if (act === "save-goal") {
      var g = state.goals.filter(function (x) { return x.id === id; })[0];
      if (!g) return;
      saveGoalId = id;
      document.getElementById("save-title").textContent = "Setor ke " + g.name;
      document.getElementById("save-hint").textContent = "Saldo tersedia " + rp(balance()) + ". Sisa target " + rp(Math.max(g.target - g.saved, 0)) + ".";
      document.getElementById("s-amount").value = "";
      showErr("save-err", "");
      openSheet("sheet-save");
      setTimeout(function () { document.getElementById("s-amount").focus(); }, 30);
    }
    else if (act === "main-goal") { state.goals.forEach(function (g) { g.main = g.id === id; }); save(); render(); toast("Target utama diganti"); }
    else if (act === "del-goal") {
      state.goals = state.goals.filter(function (g) { return g.id !== id; });
      if (state.goals.length && !state.goals.some(function (g) { return g.main; })) state.goals[0].main = true;
      save(); render(); toast("Target dihapus");
    }
    else if (act === "reset-ask") { resetArmed = true; render(); }
    else if (act === "reset-no") { resetArmed = false; render(); }
    else if (act === "reset-yes") { state = blank(""); resetArmed = false; save(); render(); toast("Semua data dihapus"); }
  });

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target.id;
    if (f === "form-add") {
      var type = document.querySelector('input[name="f-type"]:checked').value;
      var amount = digits(document.getElementById("f-amount").value);
      var date = document.getElementById("f-date").value || todayKey();
      if (amount <= 0) { showErr("add-err", "Isi jumlah lebih dari nol."); return; }
      var catEl = document.querySelector('input[name="f-cat"]:checked');
      var cat = type === "in" ? "masuk" : (catEl ? catEl.value : "lainnya");
      var note = document.getElementById("f-note").value.trim();
      state.tx.push({ id: state.nextId++, date: date, type: type, cat: cat, amount: amount, note: note });
      save(); closeSheets(); render();
      if (type === "out" && date === todayKey()) {
        var ls = limitState();
        if (ls.pct > 1) toast("Limit hari ini terlewati " + rp(ls.spent - ls.lim));
        else if (ls.pct >= 0.8) toast("Hampir mencapai batas! Sisa " + rp(ls.left));
        else toast("Pengeluaran dicatat. Sisa limit " + rp(ls.left));
      } else toast(type === "in" ? "Pemasukan dicatat" : "Pengeluaran dicatat");
    }
    else if (f === "form-save") {
      var g = state.goals.filter(function (x) { return x.id === saveGoalId; })[0];
      var amt = digits(document.getElementById("s-amount").value);
      if (!g) return;
      if (amt <= 0) { showErr("save-err", "Isi jumlah lebih dari nol."); return; }
      if (amt > balance()) { showErr("save-err", "Saldo tidak cukup. Saldo tersedia " + rp(balance()) + "."); return; }
      g.saved += amt;
      state.tx.push({ id: state.nextId++, date: todayKey(), type: "save", cat: "tabung", amount: amt, note: "Setor ke " + g.name, goalId: g.id });
      save(); closeSheets(); render(); toast("Berhasil menyetor " + rp(amt));
    }
    else if (f === "form-goal") {
      var name = document.getElementById("g-name").value.trim();
      var target = digits(document.getElementById("g-target").value);
      if (!name) { showErr("goal-err", "Isi nama target."); return; }
      if (target <= 0) { showErr("goal-err", "Isi jumlah target lebih dari nol."); return; }
      state.goals.push({ id: state.nextGoal++, name: name, target: target, saved: 0, main: state.goals.length === 0 });
      save(); render(); toast("Target ditambahkan");
    }
  });

  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheets(); });

  /* ===== Pantau orang tua ===== */
  var shareLink = "", shareDays = 0;
  var P = null, pperiod = "7", pcat = "all";
  var KNOWN = { makan: 1, transport: 1, hiburan: 1, belanja: 1, sekolah: 1, lainnya: 1, masuk: 1, tabung: 1 };

  function b64e(bytes) {
    var s = "";
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64d(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    var bin = atob(str), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function pack(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (window.CompressionStream) {
      var cs = new CompressionStream("gzip"), w = cs.writable.getWriter();
      w.write(bytes); w.close();
      return new Response(cs.readable).arrayBuffer().then(function (buf) { return "z" + b64e(new Uint8Array(buf)); });
    }
    return Promise.resolve("p" + b64e(bytes));
  }
  function unpack(str) {
    var kind = str.charAt(0), bytes = b64d(str.slice(1));
    var step = Promise.resolve(bytes);
    if (kind === "z") {
      var ds = new DecompressionStream("gzip"), w = ds.writable.getWriter();
      w.write(bytes); w.close();
      step = new Response(ds.readable).arrayBuffer().then(function (b) { return new Uint8Array(b); });
    }
    return step.then(function (b) { return JSON.parse(new TextDecoder().decode(b)); });
  }

  function snapshot(days) {
    var cutoff = dkey(addDays(new Date(), -(days - 1)));
    var tx = state.tx.filter(function (t) { return t.date >= cutoff; })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id; })
      .slice(0, 150)
      .map(function (t) { return [t.date, t.type, t.cat, t.amount, t.note || ""]; });
    return {
      v: 1, n: state.name, t: Date.now(), d: days, l: state.limit, s: balance(),
      g: state.goals.map(function (g) { return [g.name, g.target, g.saved, g.main ? 1 : 0]; }), x: tx
    };
  }
  function makeShare() {
    var tries = [30, 14, 7], i = 0;
    function attempt() {
      return pack(snapshot(tries[i])).then(function (code) {
        var url = location.href.split("#")[0] + "#ortu=" + code;
        if (url.length > 6000 && i < tries.length - 1) { i++; return attempt(); }
        shareLink = url; shareDays = tries[i];
        render(); toast("Tautan untuk orang tua siap");
      });
    }
    attempt().catch(function () { toast("Tautan gagal dibuat di browser ini"); });
  }
  function parentCard() {
    var h = '<section class="card"><h2>Pantau orang tua</h2>' +
      '<p class="hint" style="margin:0 0 12px">Orang tua bisa melihat uang sakumu dipakai untuk apa dan berapa lewat tautan khusus. Mereka hanya bisa melihat dan tidak bisa mengubah data. Tautan berisi catatan transaksi terbaru dan target tabunganmu.</p>';
    if (state.sample) h += '<div class="alert" style="margin:0 0 12px">Kamu masih memakai data contoh. Hapus dulu data contoh agar orang tua melihat data aslimu.</div>';
    h += '<button class="btn" data-action="make-share" style="width:100%">' + (shareLink ? "Perbarui tautan" : "Buat tautan untuk orang tua") + "</button>";
    if (shareLink) {
      var wa = "https://wa.me/?text=" + encodeURIComponent("Halo, ini pantauan uang sakuku di HematYUK!: " + shareLink);
      h += '<div class="field" style="margin:14px 0 0"><label for="share-url">Tautan untuk orang tua</label><input type="text" id="share-url" readonly value="' + esc(shareLink) + '"></div>' +
        '<div class="inline-set" style="margin-top:10px"><button class="btn ghost" data-action="copy-share" style="flex:1">Salin tautan</button>' +
        '<a class="btn" href="' + esc(wa) + '" target="_blank" rel="noopener" style="flex:1">Kirim lewat WhatsApp</a></div>' +
        '<p class="hint">Berisi data ' + shareDays + ' hari terakhir. Data tidak berubah sendiri, jadi buat tautan baru setiap kali ingin memperbarui yang dilihat orang tua.</p>';
    }
    return h + "</section>";
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-action]");
    if (a) {
      var act = a.getAttribute("data-action");
      if (act === "make-share") makeShare();
      else if (act === "copy-share") {
        var done = function () { toast("Tautan disalin"); };
        var fallback = function () {
          var el = document.getElementById("share-url");
          if (el) { el.focus(); el.select(); }
          toast("Tekan lama pada kotak tautan lalu pilih salin");
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(shareLink).then(done, fallback);
        else fallback();
      }
    }
    var pp = e.target.closest("[data-pperiod]");
    if (pp && P) { pperiod = pp.getAttribute("data-pperiod"); renderParent(); return; }
    var pc = e.target.closest("[data-pcat]");
    if (pc && P) { pcat = pc.getAttribute("data-pcat"); renderParent(); }
  });

  function sanitize(d) {
    if (!d || d.v !== 1) throw new Error("bad");
    var n = function (x) { x = Number(x); return isFinite(x) ? x : 0; };
    return {
      n: String(d.n || "").slice(0, 24), t: n(d.t) || Date.now(), d: Math.max(1, Math.min(n(d.d) || 30, 30)), l: n(d.l), s: n(d.s),
      g: (d.g || []).slice(0, 20).map(function (g) { return { name: String(g[0]).slice(0, 40), target: n(g[1]), saved: n(g[2]), main: !!g[3] }; }),
      x: (d.x || []).slice(0, 300).map(function (r) {
        return {
          date: /^\d{4}-\d{2}-\d{2}$/.test(r[0]) ? r[0] : "1970-01-01",
          type: r[1] === "in" || r[1] === "save" ? r[1] : "out",
          cat: KNOWN[r[2]] === 1 ? r[2] : "lainnya", amount: n(r[3]), note: String(r[4] || "").slice(0, 60)
        };
      })
    };
  }
  function stamp(d) { return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear() + ", " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }

  function renderParent() {
    var ref = new Date(P.t), nm = P.n || "Anak";
    var allSpan = P.d;
    if (P.x.length) {
      var minD = P.x.reduce(function (m, t) { return t.date < m ? t.date : m; }, "9999-99-99");
      var md = new Date(+minD.slice(0, 4), +minD.slice(5, 7) - 1, +minD.slice(8, 10));
      var rd = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
      allSpan = Math.max(1, Math.min(P.d, Math.round((rd - md) / 86400000) + 1));
    }
    var span = pperiod === "7" ? 7 : allSpan, keys = {}, i;
    for (i = 0; i < span; i++) keys[dkey(addDays(ref, -i))] = 1;
    var inP = P.x.filter(function (t) { return keys[t.date]; });
    var outs = inP.filter(function (t) { return t.type === "out"; });
    var total = 0, perDay = {}, perCat = {};
    outs.forEach(function (t) {
      total += t.amount; perDay[t.date] = (perDay[t.date] || 0) + t.amount; perCat[t.cat] = (perCat[t.cat] || 0) + t.amount;
    });
    var over = 0;
    Object.keys(perDay).forEach(function (k) { if (P.l > 0 && perDay[k] > P.l) over++; });
    var age = Math.floor((Date.now() - P.t) / 86400000);
    var cats = Object.keys(perCat).sort(function (a, b) { return perCat[b] - perCat[a]; });
    var h = "";

    h += '<section class="card"><span class="label">Pantauan uang saku</span><h2 style="font-size:24px;margin:4px 0 6px">' + esc(nm) + "</h2>" +
      '<div class="hint num" style="margin:0">Diperbarui ' + stamp(ref) + "</div>" +
      (age >= 2 ? '<div class="alert">Data ini sudah ' + age + " hari yang lalu. Minta " + esc(nm) + " membuat tautan baru agar data terbaru terlihat.</div>" : "") + "</section>";

    h += '<div class="row"><div class="seg"><button data-pperiod="7" class="' + (pperiod === "7" ? "on" : "") + '">7 hari</button><button data-pperiod="all" class="' + (pperiod === "all" ? "on" : "") + '">Semua data (' + allSpan + ' hari)</button></div></div>';

    h += '<div class="stats"><div class="stat"><span class="label">Saldo saat ini</span><b class="num">' + rp(P.s) + '</b></div>' +
      '<div class="stat"><span class="label">Total pengeluaran</span><b class="num">' + rp(total) + '</b></div>' +
      '<div class="stat"><span class="label">Rata-rata per hari</span><b class="num">' + rp(total / span) + '</b></div>' +
      '<div class="stat"><span class="label">Melewati limit</span><b class="num">' + over + " hari</b><span class=\"hint num\" style=\"margin:0\">Limit " + rp(P.l) + " per hari</span></div></div>";

    h += '<section class="card"><h2>Uang dipakai untuk apa</h2>';
    if (!cats.length) h += '<p class="empty">Tidak ada pengeluaran pada periode ini.</p>';
    cats.forEach(function (id) {
      var c = catOf(id), p = total ? perCat[id] / total * 100 : 0;
      h += '<div class="catrow"><div class="row"><span class="catname"><i class="sw" style="background:' + c.c + '"></i>' + c.n + '</span><b class="num">' + rp(perCat[id]) + ' <span class="pct">' + Math.round(p) + '%</span></b></div>' +
        '<div class="bar"><i style="width:' + p + '%;background:' + c.c + '"></i></div></div>';
    });
    h += "</section>";

    var days = [];
    for (i = 6; i >= 0; i--) { var d = addDays(ref, -i); days.push({ k: dkey(d), label: DAYS[d.getDay()], v: perDayAll(dkey(d)) }); }
    h += '<section class="card"><h2>Pengeluaran per hari</h2>' + barsHtml(days) + '<div class="hint">7 hari terakhir. Garis putus-putus adalah limit harian ' + rp(P.l) + ". Batang merah melewati limit.</div></section>";

    var top = cats[0];
    var msg;
    if (!total) msg = '<div class="alert good" style="margin:0">Tidak ada pengeluaran pada periode ini.</div>';
    else {
      msg = '<div class="alert' + (over ? "" : " good") + '" style="margin:0">Pengeluaran terbesar ada di kategori <b>' + catOf(top).n + "</b> sebesar " + rp(perCat[top]) + " (" + Math.round(perCat[top] / total * 100) + "%). " +
        (over ? esc(nm) + " melewati limit harian pada " + over + " hari." : esc(nm) + " tidak pernah melewati limit harian.") + "</div>";
    }
    h += '<section class="card"><h2>Ringkasan</h2>' + msg + "</section>";

    h += '<section class="card"><h2>Daftar transaksi</h2><div class="chips-row"><button class="pchip' + (pcat === "all" ? " on" : "") + '" data-pcat="all">Semua</button>' +
      cats.map(function (id) { return '<button class="pchip' + (pcat === id ? " on" : "") + '" data-pcat="' + id + '">' + catOf(id).n + "</button>"; }).join("") + "</div>";
    var list = inP.filter(function (t) { return pcat === "all" || (t.type === "out" && t.cat === pcat); })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    if (!list.length) h += '<p class="empty">Tidak ada transaksi.</p>';
    var last = "";
    list.slice(0, 60).forEach(function (t) {
      var c = catOf(t.cat), isIn = t.type === "in";
      if (t.date !== last) { h += '<div class="dayhead">' + dateLabel(t.date) + "</div>"; last = t.date; }
      h += '<div class="tx ptx"><div class="dot" style="background:' + c.c + '">' + c.s + '</div><div style="min-width:0"><div class="t">' + esc(t.note || c.n) + '</div><div class="s">' + c.n + '</div></div>' +
        '<div class="amt num ' + (isIn ? "in" : "") + '">' + (isIn ? "+" : "-") + rp(t.amount) + "</div></div>";
    });
    h += "</section>";

    h += '<section class="card"><h2>Target tabungan</h2>';
    if (!P.g.length) h += '<p class="empty">Belum ada target.</p>';
    P.g.forEach(function (g) {
      var p = g.target > 0 ? Math.min(g.saved / g.target, 1) : 0;
      h += '<div class="goal"><div><strong>' + esc(g.name) + "</strong>" + (g.main ? '<span class="pill">Utama</span>' : "") + '<div class="meta num">' + rp(g.saved) + " dari " + rp(g.target) + '</div></div><b class="num">' + Math.round(p * 100) + '%</b><div class="bar"><i style="width:' + (p * 100) + '%"></i></div></div>';
    });
    h += "</section>";

    h += '<p class="hint" style="text-align:center">Tampilan khusus orang tua. Hanya bisa dilihat dan tidak bisa diubah.<br><a href="' + esc(location.href.split("#")[0]) + '" style="color:var(--accent)">Buka HematYUK! milikku</a></p>';
    document.getElementById("view").innerHTML = h;
  }
  function perDayAll(k) {
    var s = 0;
    P.x.forEach(function (t) { if (t.type === "out" && t.date === k) s += t.amount; });
    return s;
  }
  function startParent(code) {
    document.querySelector(".nav").hidden = true;
    document.getElementById("hello").textContent = "Mode orang tua";
    unpack(code).then(function (d) {
      P = sanitize(d); state = { limit: P.l }; renderParent();
    }).catch(function () {
      document.getElementById("view").innerHTML = '<section class="card"><h2>Tautan tidak bisa dibuka</h2><p class="hint">Tautan ini rusak, terpotong, atau dibuka di browser yang terlalu lama. Minta anakmu membuat tautan baru dari menu Akun, lalu salin seluruh tautannya.</p><a class="btn" href="' + esc(location.href.split("#")[0]) + '">Buka HematYUK!</a></section>';
    });
  }

  if ((location.hash || "").indexOf("#ortu=") === 0) startParent(location.hash.slice(6));
  else { state = load(); render(); }
  window.addEventListener("hashchange", function () { if ((location.hash || "").indexOf("#ortu=") === 0) location.reload(); });
})();
</script>
</body>
</html>
